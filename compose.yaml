services:
  server:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persist SQLite database, ChromaDB embeddings, and documents
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  mcp:
    build:
      context: .
    command: ["python", "-m", "app.service.mcp_server", "--http"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  a2a:
    build:
      context: .
    command: ["python", "-m", "app.service.a2a_server"]
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
