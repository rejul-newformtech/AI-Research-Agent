services:
  server:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - A2A_SERVER_URL=http://a2a:8082
    depends_on:
      - a2a
    volumes:
      # Persist SQLite database, ChromaDB embeddings, and documents
      - app_data:/app/data
      - app_logs:/app/logs
    restart: unless-stopped

  mcp:
    build:
      context: .
    command: ["python", "-m", "a2a_server.mcp.server", "--http", "--host", "0.0.0.0"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    restart: unless-stopped

  a2a:
    build:
      context: .
    command: ["python", "-m", "a2a_server.server"]
    ports:
      - "8082:8082"
    env_file:
      - .env
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    restart: unless-stopped

volumes:
  app_data:
  app_logs:
