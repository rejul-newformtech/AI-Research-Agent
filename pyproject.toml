[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rejul-newformtech", email = "rejul.reghu@newformtech.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "google-adk>=2.9.1",
    "google-genai>=2.23.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pypdf>=6.18.1",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
research-agent = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.fastapi-cli]
root = "app.main:app"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Allow function calls in argument defaults for FastAPI Depends()
    "E501",  # Line length is handled by ruff format
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
asyncio_default_fixture_loop_scope = "function"
