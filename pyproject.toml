[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rejul-newformtech", email = "rejul.reghu@newformtech.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.23.0",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.5.3",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
research-agent = "research_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi-cli]
root = "src/research_agent/main:app"
